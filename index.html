<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap" rel="stylesheet">
    <title>Sign In</title>
</head>

<body>
    <div class="heading">
        <h2>Welcome to</h2>
        <h3>Amit Chauhan's Network</h3>

        <div class="input-field">
            <div class="input">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter Your Username" required>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Your Password" required>

                <div class="remember-forgot">
                    <label>
                        <input type="checkbox" id="remember-me"> Remember Me
                    </label>
                    <a href="forgot-password.html" id="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit">Sign In</button>
            </div>

            <label for="signup">New User</label>
            <a id="signup" href="signup.html">Sign Up</a>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
