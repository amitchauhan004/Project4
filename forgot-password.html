<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="favicon.ico.png" type="image/x-icon">
    <title>Forgot Password</title>
</head>

<body>
    <div class="heading">
        <h2>Forgot Password</h2>
        <h3>Reset Your Password</h3>

        <div class="input-field">
            <div class="input">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter Your Registered Email" required>

                <button type="submit" id="reset-password">Reset Password</button>
            </div>

            <a href="index.html" id="back-to-login">Back to Login</a>
        </div>
    </div>

    <script>
        document.getElementById('reset-password').addEventListener('click', (event) => {
            event.preventDefault();
            const email = document.getElementById('email').value;

            if (email) {
                alert(`A password reset link has been sent to ${email}`);
            } else {
                alert('Please enter your registered email address.');
            }
        });
    </script>
</body>

</html>
